<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halloween Challenge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,serif;color:#fff;background:radial-gradient(circle at 50% 30%,#57200f 0,#17101a 38%,#07050a 80%)}
body{overflow:hidden}
.fog{position:fixed;inset:-20%;opacity:.2;pointer-events:none;background:radial-gradient(ellipse,#ddd0 0,#ddd8 22%,transparent 50%);filter:blur(35px);animation:fog 9s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(35px) scale(1.06)}}
.app{width:min(430px,100vw);height:100vh;margin:auto;padding:14px 16px 20px;display:flex;flex-direction:column;position:relative}
.header{text-align:center;font-size:20px;font-weight:bold;padding:5px;text-shadow:0 2px 10px #000}
.sub{font-size:12px;color:#cdb5ca;font-weight:normal;margin-top:2px}
.scene{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.frame{width:min(350px,88vw);height:min(590px,70vh);position:relative;perspective:1200px}
.wall{position:absolute;inset:0;border-radius:18px;background:linear-gradient(145deg,#24171b,#0d090e);box-shadow:0 22px 65px #000}
.doorway{position:absolute;inset:12px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 43%,#ffb452,#651f10 25%,#080609 65%);box-shadow:inset 0 0 50px #000}
.glow{position:absolute;z-index:1;inset:15% 8% 0;background:#ff8a2a;filter:blur(48px);opacity:.32}
.admin{position:absolute;z-index:3;left:50%;bottom:-2%;width:105%;height:98%;transform:translate(-50%,58%) scale(.78);opacity:0;transition:transform 1.05s cubic-bezier(.2,.85,.2,1),opacity .55s;display:flex;align-items:flex-end;justify-content:center}
.admin.show{transform:translate(-50%,0) scale(1);opacity:1}
.admin img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 0 26px #ff8b2d99)}
.door{position:absolute;z-index:5;inset:0;transform-origin:left center;background:repeating-linear-gradient(90deg,transparent 0 48px,#120e12 49px 54px),linear-gradient(90deg,#3a2327,#613b34 50%,#29181d);border:5px solid #171015;box-shadow:inset 0 0 40px #000;transition:transform 1.35s cubic-bezier(.72,0,.2,1),filter .3s}
.door:before{content:"";position:absolute;inset:28px;border:2px solid #28161b;box-shadow:inset 0 0 30px #000}
.door:after{content:"🎃";position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:65px;filter:drop-shadow(0 0 12px #ff761b)}
.door.open{transform:rotateY(-110deg);filter:brightness(.68)}
.knob{position:absolute;right:27px;top:52%;width:20px;height:20px;border-radius:50%;background:#d29c4a;box-shadow:0 2px 9px #000}
.spider{position:absolute;z-index:10;font-size:30px;animation:swing 3s ease-in-out infinite}
.s1{left:-8px;top:3%}
.s2{right:-8px;bottom:6%}
@keyframes swing{50%{transform:translateY(11px) rotate(5deg)}}
.tap{border:0;border-radius:999px;padding:16px 30px;background:linear-gradient(135deg,#ff9820,#c14b1d);color:#fff;font:bold 18px Georgia;box-shadow:0 8px 28px #0009,0 0 22px #ff7b2444;cursor:pointer}
.tap:disabled{opacity:.55}
.status{height:30px;text-align:center;color:#dec5c7;font-size:14px;padding-top:9px}
.shake{animation:shake .55s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.card{position:absolute;z-index:20;left:50%;bottom:68px;width:min(390px,90vw);transform:translate(-50%,38px);opacity:0;pointer-events:none;background:#120b15ee;border:1px solid #b27b56;border-radius:20px;padding:19px;box-shadow:0 18px 60px #000;backdrop-filter:blur(10px);transition:.65s}
.card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card h2{margin:0 0 12px;text-align:center;font-size:22px}
.task{background:#f1dfbe;color:#281a1b;border-radius:12px;padding:17px;line-height:1.45;font-size:16px}
.complete{display:block;width:100%;margin:14px auto 0;border:0;background:linear-gradient(135deg,#6e9d42,#3f6f31);color:#fff;border-radius:999px;padding:12px 18px;font:bold 15px Georgia;cursor:pointer}
.complete:disabled{opacity:.55}
.close{display:block;margin:10px auto 0;border:1px solid #875b6e;background:#29172f;color:#fff;border-radius:999px;padding:9px 20px}
.error{color:#ffb3a7}
</style>
</head>
<body>
<div class="fog"></div>

<main class="app">
  <div class="header">🎃 Halloween Challenge<div class="sub">mini app</div></div>

  <div class="scene">
    <div class="frame">
      <div class="wall"></div>
      <div class="doorway">
        <div class="glow"></div>
        <div class="admin" id="admin">
          <img id="adminPhoto" alt="Фото адміна">
        </div>
        <div class="door" id="door">
          <div class="knob"></div>
        </div>
      </div>
      <div class="spider s1">🕷️</div>
      <div class="spider s2">🕸️</div>
    </div>
  </div>

  <button class="tap" id="tap">👊 ПОСТУКАТИ</button>
  <div class="status" id="status">Наважишся?</div>
</main>

<div class="card" id="card">
  <h2 id="who"></h2>
  <div class="task" id="task"></div>
  <button class="complete" id="complete">✅ ЗАВДАННЯ ВИКОНАНО</button>
  <button class="close" id="close">Закрити</button>
</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const door = document.getElementById('door');
const admin = document.getElementById('admin');
const photo = document.getElementById('adminPhoto');
const tap = document.getElementById('tap');
const status = document.getElementById('status');
const card = document.getElementById('card');
const who = document.getElementById('who');
const task = document.getElementById('task');
const complete = document.getElementById('complete');
const closeBtn = document.getElementById('close');

let currentTask = null;
let nextTask = null;
let busy = false;

function getInitData() {
  return tg?.initData || '';
}

async function api(url, options = {}) {
  const initData = getInitData();

  const headers = {
    'Content-Type': 'application/json',
    'X-Telegram-Init-Data': initData,
    ...(options.headers || {})
  };

  const response = await fetch(url, {
    ...options,
    headers,
    body: JSON.stringify({
      ...(options.body ? JSON.parse(options.body) : {}),
      initData
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || data.error || `HTTP ${response.status}`);
  }

  return data;
}

function closeDoorForNextTask() {
  card.classList.remove('show');

  // Прибираємо попереднього адміна.
  admin.classList.remove('show');

  // Повертаємо двері у початковий закритий стан.
  door.classList.remove('open');
  door.classList.remove('shake');

  photo.removeAttribute('src');
  who.textContent = '';
  task.textContent = '';

  tap.disabled = false;
  complete.disabled = false;
  status.textContent = 'Наважишся?';
  busy = false;
}

function prepareTask(data) {
  if (!data || data.completed) {
    currentTask = null;
    nextTask = null;
    tap.disabled = true;
    status.textContent = '🎉 Ти виконала всі 5 завдань!';
    return;
  }

  currentTask = data;

  // Завдання вже є на сервері, але на екрані його НЕ показуємо,
  // доки користувач знову не постукає.
  tap.disabled = false;
  status.textContent = 'Наважишся?';
}

async function loadCurrentTask() {
  if (!getInitData()) {
    status.innerHTML = '<span class="error">⚠️ Відкрий Mini App через Telegram</span>';
    tap.disabled = true;
    return;
  }

  try {
    const data = await api('/api/task', {
      method: 'POST',
      body: JSON.stringify({})
    });

    prepareTask(data);
  } catch (error) {
    console.error(error);
    status.innerHTML = `<span class="error">⚠️ ${error.message}</span>`;
    tap.disabled = true;
  }
}

function openCurrentTask() {
  if (!currentTask || busy) return;

  busy = true;
  tap.disabled = true;

  const adminData = currentTask.admin;
  const taskData = currentTask.task;

  photo.src = adminData.photo;
  photo.alt = 'Фото ' + adminData.name;

  status.textContent = '👊 ТУК… ТУК… ТУК…';
  door.classList.add('shake');

  setTimeout(() => {
    door.classList.remove('shake');
    door.classList.add('open');
    status.textContent = '😈 Хтось відчиняє...';
  }, 650);

  setTimeout(() => {
    admin.classList.add('show');
    status.textContent = '👻 Тебе зустрічає ' + adminData.name + '...';
  }, 1350);

  setTimeout(() => {
    who.textContent = '🎃 За дверима — ' + adminData.name + '!';
    task.textContent = taskData.text;
    card.classList.add('show');
    status.textContent = '✨ Завдання отримано!';
    busy = false;
  }, 2450);
}

tap.addEventListener('click', openCurrentTask);

complete.addEventListener('click', async () => {
  if (!currentTask || busy) return;

  busy = true;
  complete.disabled = true;

  try {
    const data = await api('/api/task/complete', {
      method: 'POST',
      body: JSON.stringify({
        taskId: currentTask.task.id
      })
    });

    if (data.completed) {
      card.classList.remove('show');
      admin.classList.remove('show');
      door.classList.remove('open');
      photo.removeAttribute('src');
      tap.disabled = true;
      status.textContent = '🎉 Ти виконала всі 5 завдань!';
      currentTask = null;
      nextTask = null;
      return;
    }

    /*
     * Сервер уже вибрав нового випадкового адміна + завдання.
     * Ми НЕ показуємо його одразу.
     * Зберігаємо його і повертаємо користувача до закритих дверей.
     */
    nextTask = data;
    currentTask = nextTask;

    closeDoorForNextTask();

  } catch (error) {
    console.error(error);
    complete.disabled = false;
    busy = false;
    status.innerHTML = `<span class="error">⚠️ ${error.message}</span>`;
  }
});

closeBtn.addEventListener('click', () => {
  if (tg) {
    tg.close();
  } else {
    location.reload();
  }
});

photo.onerror = () => {
  status.innerHTML = '<span class="error">⚠️ Не вдалося завантажити фото адміна</span>';
};

loadCurrentTask();
</script>
</body>
</html>
